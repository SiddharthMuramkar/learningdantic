name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Install Python (respects .python-version)
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Execute keyless notebooks (00 + 08)
        # These two notebooks run with zero API keys: notebook 00 smoke-tests
        # the environment with pydantic-ai's TestModel, notebook 08 teaches
        # offline testing. Everything else needs your keys → run locally.
        run: uv run pytest notebooks/00_setup_and_env_check.ipynb notebooks/08_offline_testing.ipynb
