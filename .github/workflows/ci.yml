name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies (uv installs the Python in .python-version)
        run: uv sync --locked

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check course rules and the git guard hook
        run: |
          uv run python scripts/check_notebooks.py --self-test
          uv run python scripts/check_notebooks.py
          uv run python .claude/hooks/guard_git.py --self-test

      - name: Unit tests, keyless notebooks and solutions
        # These run with zero API keys, using pydantic-ai's TestModel / FunctionModel.
        run: >-
          uv run pytest
          tests
          notebooks/00_setup_and_env_check.ipynb
          notebooks/08_offline_testing.ipynb
          notebooks/09_toolsets_and_mcp.ipynb
          notebooks/10_capabilities_and_guardrails.ipynb
          notebooks/12_evals.ipynb
          notebooks/13_ship_it.ipynb
          notebooks/14_capstone_support_desk.ipynb
          solutions/08_offline_assertions.ipynb
          solutions/09_scoped_recipe_server.ipynb
          solutions/10_guarded_helpdesk.ipynb
          solutions/12_eval_your_steering.ipynb
          solutions/13_two_chats.ipynb
          solutions/14_capstone_extension.ipynb

      - name: Smoke-run the live notebooks on the fake model
        # MODEL=test makes every Agent(MODEL) a TestModel: no key, no cost. This catches API drift,
        # not wrong answers. To see real answers, run them with your key:
        #   uv run pytest notebooks/01_first_agent.ipynb
        env:
          MODEL: test
        run: >-
          uv run pytest
          notebooks/01_first_agent.ipynb
          notebooks/02_models_and_providers.ipynb
          notebooks/03_structured_outputs.ipynb
          notebooks/04_tools.ipynb
          notebooks/05_dependencies.ipynb
          notebooks/06_logfire_observability.ipynb
          notebooks/07_history_and_streaming.ipynb
          notebooks/11_multi_agent.ipynb
