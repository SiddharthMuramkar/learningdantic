name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies (uv installs the Python in .python-version)
        run: uv sync --locked

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check course rules and the git guard hook
        run: |
          uv run python scripts/check_notebooks.py --self-test
          uv run python scripts/check_notebooks.py
          uv run python .claude/hooks/guard_git.py --self-test

      - name: Unit tests, keyless notebooks and solutions
        # These run with zero API keys, using pydantic-ai's TestModel / FunctionModel.
        # --overwrite saves each cell's output so the crash check below can read it.
        run: >-
          uv run pytest --overwrite
          tests
          notebooks/00_setup_and_env_check.ipynb
          notebooks/08_offline_testing.ipynb
          notebooks/09_toolsets_and_mcp.ipynb
          notebooks/10_capabilities_and_guardrails.ipynb
          notebooks/12_evals.ipynb
          notebooks/13_ship_it.ipynb
          notebooks/14_capstone_support_desk.ipynb
          solutions/08_offline_assertions.ipynb
          solutions/09_scoped_recipe_server.ipynb
          solutions/10_guarded_helpdesk.ipynb
          solutions/11_support_triage.ipynb
          solutions/12_eval_your_steering.ipynb
          solutions/13_two_chats.ipynb
          solutions/14_capstone_extension.ipynb

      - name: Fail on crashed cells
        # An error raised inside agent.run can reach Jupyter as printed text, which nbmake counts as
        # a pass. This reads the outputs saved above (keyless notebooks only) and fails on a traceback.
        run: >-
          uv run python scripts/check_notebooks.py --executed
          notebooks/00_setup_and_env_check.ipynb
          notebooks/08_offline_testing.ipynb
          notebooks/09_toolsets_and_mcp.ipynb
          notebooks/10_capabilities_and_guardrails.ipynb
          notebooks/12_evals.ipynb
          notebooks/13_ship_it.ipynb
          notebooks/14_capstone_support_desk.ipynb
          solutions/08_offline_assertions.ipynb
          solutions/09_scoped_recipe_server.ipynb
          solutions/10_guarded_helpdesk.ipynb
          solutions/11_support_triage.ipynb
          solutions/12_eval_your_steering.ipynb
          solutions/13_two_chats.ipynb
          solutions/14_capstone_extension.ipynb

      - name: Smoke-run the live notebooks on the fake model
        # MODEL=test makes every Agent(MODEL) a TestModel: no key, no cost. This catches API drift,
        # not wrong answers. shortcut: no crash check here, because the fake model can't recover from a
        # retry the way a real one does (03, 04); run them with your key to see real answers:
        #   uv run pytest notebooks/01_first_agent.ipynb
        env:
          MODEL: test
        run: >-
          uv run pytest
          notebooks/01_first_agent.ipynb
          notebooks/02_models_and_providers.ipynb
          notebooks/03_structured_outputs.ipynb
          notebooks/04_tools.ipynb
          notebooks/05_dependencies.ipynb
          notebooks/06_logfire_observability.ipynb
          notebooks/07_history_and_streaming.ipynb
          notebooks/11_multi_agent.ipynb

  # The Acme Desk app (app/): real Postgres, the fake model, no API keys.
  fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODEL: test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: acme
          POSTGRES_PASSWORD: acme
          POSTGRES_DB: acme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U acme -d acme"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies, including the app group
        run: uv sync --locked --group app

      - name: App tests
        run: uv run pytest app/tests --ignore=app/tests/e2e
