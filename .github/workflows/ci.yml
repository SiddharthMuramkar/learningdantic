name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python (respects .python-version)
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check course rules (setup cell, no asyncio, no run_sync)
        run: |
          uv run python scripts/check_notebooks.py --self-test
          uv run python scripts/check_notebooks.py

      - name: Execute keyless notebooks and solutions
        # These run with zero API keys, using pydantic-ai's TestModel / FunctionModel.
        # The rest need your key, so run them locally: uv run pytest notebooks/01_first_agent.ipynb
        run: >-
          uv run pytest
          notebooks/00_setup_and_env_check.ipynb
          notebooks/08_offline_testing.ipynb
          solutions/08_offline_assertions.ipynb
