[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learningdantic"
version = "0.1.0"
description = "Hands-on Jupyter notebooks for learning Pydantic AI v2 + Logfire — agent orchestration by building, not by reading."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    # Pydantic AI v2 (stable since 2026-06) — bundles the openai/anthropic/google/logfire/mcp/evals extras,
    # so switching providers later is just a .env edit.
    "pydantic-ai>=2.57.0,<3",
    # Explicit: we call logfire.configure() / instrument_pydantic_ai() directly in every notebook.
    # <6: logfire 6.0 is still in beta as of Oct 2026.
    "logfire>=5.2,<6",
    "python-dotenv>=1.0",
    # Declared for the notebook-05 dependency-injection exercise (also a pydantic-ai transitive dep).
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "jupyterlab>=4",
    "ipykernel>=6",
    "nbformat>=5.10",
    "pytest>=8",
    "nbmake>=1.5",
    "pytest-xdist>=3",
    "ruff>=0.17",
    "pre-commit>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/learningdantic"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Notebooks are teaching material: long instruction strings read better unwrapped.
"*.ipynb" = ["E501"]

[tool.pytest.ini_options]
# nbmake turns `uv run pytest` into "execute every notebook top-to-bottom".
# Needs your .env keys locally; CI only executes the two keyless notebooks (00, 08).
testpaths = ["notebooks"]
addopts = "--nbmake --nbmake-timeout=600"
